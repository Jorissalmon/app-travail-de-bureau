name: APK release

# Builds a signed release APK and attaches it to a GitHub Release (§9.5).
# Triggered by pushing a tag like v1.0.0, or manually.
#
# Required repo secrets:
#   ANDROID_KEYSTORE_BASE64  - base64 of the .jks keystore
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Required repo variable:
#   OTA_BASE_URL             - https://<project>.vercel.app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3

      - run: pnpm install --frozen-lockfile

      - name: Build web + sync
        env:
          VITE_API_BASE_URL: ${{ vars.OTA_BASE_URL }}
          VITE_BUNDLE_VERSION: ${{ github.ref_name }}
        run: |
          pnpm build:only
          pnpm exec cap sync android

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/releve-release.jks
          cat > android/keystore.properties <<PROPS
          storeFile=releve-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS

      - name: Assemble release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
