name: APK release

# Builds a signed release APK and attaches it to a GitHub Release (§9.5).
# Triggered by pushing a tag like v1.0.0, or manually.
#
# Required repo secrets:
#   ANDROID_KEYSTORE_BASE64  - base64 of the .jks keystore
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Required repo variable:
#   OTA_BASE_URL             - https://<project>.vercel.app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      # La branche par défaut du dépôt n'est pas main, donc « Run workflow »
      # propose autre chose et on publiait une release signée construite depuis
      # une branche au hasard. Mieux vaut refuser que publier ça.
      - name: Refuser une release construite hors de main ou d'un tag
        run: |
          REF='${{ github.ref }}'
          case "$REF" in
            refs/heads/main|refs/tags/v*) echo "Construction depuis $REF." ;;
            *)
              echo "::error::Une release signée se construit depuis main ou un tag v* — pas depuis $REF. Relance le workflow en choisissant main dans le menu, ou pousse un tag v1.1.0."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3

      - run: pnpm install --frozen-lockfile

      - name: Build web + sync
        env:
          VITE_API_BASE_URL: ${{ vars.OTA_BASE_URL || 'https://app-travail-de-bureau.vercel.app' }}
        run: |
          # BUNDLE_VERSION is the version of the web content, which the OTA
          # check compares against the manifest — not the version of the shell.
          # It used to be the git tag, so tagging a release numbered above the
          # OTA line (v1.1.0 against a manifest at 1.0.11) made every later
          # bundle read as older, and the APK would never take an update again.
          export VITE_BUNDLE_VERSION=$(node -p "require('./ota/version.json').version")
          echo "Bundle version baked in: $VITE_BUNDLE_VERSION (tag: ${{ github.ref_name }})"
          pnpm build:only
          pnpm exec cap sync android

      # A missing secret used to sail through this step — `base64 -d` on an
      # empty string writes an empty file and exits 0 — and the build then died
      # inside Gradle with a message about a tampered keystore, which says
      # nothing about the actual cause. Check here, and name what is missing.
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_B64" ]  || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]     || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]  || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Secrets manquants :$missing. Crée-les dans Settings → Secrets and variables → Actions. Sans keystore, seul le workflow « APK debug » peut produire un APK."
            exit 1
          fi

          printf '%s' "$KEYSTORE_B64" | base64 -d > android/releve-release.jks
          if ! keytool -list -keystore android/releve-release.jks \
               -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Le keystore ne s'ouvre pas avec ce mot de passe et cet alias. Vérifie ANDROID_KEYSTORE_BASE64 (base64 du .jks, sans retour à la ligne), ANDROID_KEYSTORE_PASSWORD et ANDROID_KEY_ALIAS."
            exit 1
          fi
          echo "Keystore lu, alias « $KEY_ALIAS » présent."

          cat > android/keystore.properties <<PROPS
          storeFile=releve-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Assemble release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
