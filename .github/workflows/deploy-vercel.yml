name: Deploy (Vercel prod)

# Déploiement de production sur Vercel, piloté par GitHub Actions (pas besoin de
# connecter le dépôt dans le dashboard Vercel). Chaque push sur main déploie.
#
# Secrets à créer dans GitHub → Settings → Secrets and variables → Actions :
#   VERCEL_TOKEN        (Vercel → Account Settings → Tokens)
# Variables (ou secrets) à créer :
#   VERCEL_ORG_ID       (Vercel → Project → Settings → General, ou `vercel link`)
#   VERCEL_PROJECT_ID   (idem)
#
# Les variables d'environnement de l'app (DATABASE_URL, JWT_SECRET, INVITE_CODE,
# OTA_BASE_URL) restent définies côté projet Vercel ; `vercel pull` les récupère.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel project settings + env (production)
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build (Vercel)
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy prebuilt to production
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
