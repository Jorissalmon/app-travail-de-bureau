name: CI

# Typecheck, lint and test on every push and PR (§3 / §13.3).

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build:only
      # Exercises the real release path, guards included, on every PR — the
      # bundle nesting that reached 98 MB got there because nothing packaged
      # outside a push to main. Nothing is published: --no-bump, and ci.yml
      # commits nothing.
      - run: pnpm ota:local --no-bump
