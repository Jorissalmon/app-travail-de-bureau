name: APK debug

# Construit un APK de TEST (debug, non signé par ta clé — signé par la clé debug
# Android auto-générée). Installable par sideload, idéal pour les bêta-testeurs
# sans avoir à fournir de keystore. Publie l'APK dans une Release taguée "debug",
# donc toujours à la même URL :
#   https://github.com/Jorissalmon/app-travail-de-bureau/releases/download/debug/app-debug.apk
#
# Tourne à chaque push sur main, et pas seulement à la main : la branche par
# défaut du dépôt n'est pas main, donc le menu « Run workflow » propose une autre
# branche par défaut et on repartait avec un APK qui ne contenait pas ce qui
# venait d'être mergé.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3

      - run: pnpm install --frozen-lockfile

      - name: Build web + sync Android
        env:
          # L'app dans le webview est servie depuis localhost : l'API doit être
          # une URL absolue, sinon login/inscription ne joignent pas le backend.
          VITE_API_BASE_URL: ${{ vars.OTA_BASE_URL || 'https://app-travail-de-bureau.vercel.app' }}
          VITE_BUNDLE_VERSION: 1.0.0-debug
        run: |
          pnpm build:only
          pnpm exec cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Publier l'APK en artefact du run (zip téléchargeable)
        uses: actions/upload-artifact@v4
        with:
          name: logoff-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Le tag "debug" est un tag mobile : il doit suivre le commit qui a produit
      # l'APK attaché. Sans ça il reste où il a été créé, et la page de la
      # release affiche un code source sans rapport avec le fichier proposé.
      - name: Faire pointer le tag debug sur ce commit
        run: |
          git tag -f debug "${{ github.sha }}"
          git push -f origin refs/tags/debug

      - name: Relever les versions à annoncer
        id: meta
        run: |
          APP=$(sed -n 's/.*versionName *"\([^"]*\)".*/\1/p' android/app/build.gradle)
          OTA=$(node -p "require('./ota/version.json').version")
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "ota=$OTA" >> "$GITHUB_OUTPUT"
          echo "Coque $APP, contenu $OTA"

      - name: Publier l'APK dans une Release "debug"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug
          target_commitish: ${{ github.sha }}
          name: Log Off ${{ steps.meta.outputs.app }} — APK de test (debug)
          # Pas en prerelease : c'est la seule façon d'installer l'app, elle doit
          # apparaître sur la page d'accueil du dépôt. Le nom dit ce que c'est.
          prerelease: false
          make_latest: 'true'
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          body: |
            APK de test de **Log Off ${{ steps.meta.outputs.app }}**, à installer par sideload.
            Contenu web ${{ steps.meta.outputs.ota }} · construit depuis `main` (${{ github.sha }}).

            ### Désinstalle l'app avant d'installer

            Cet APK est signé par la clé de debug d'Android, regénérée à chaque
            build. La signature change donc d'une version à l'autre, et Android
            refuse d'installer par-dessus (« Application non installée »).
            Désinstaller efface la session locale : il faudra se reconnecter.

            ### Installation

            1. Autorise les « sources inconnues » pour ton navigateur ou ton gestionnaire de fichiers.
            2. Installe `app-debug.apk`.
            3. Réglages → Rappels : accorde les **quatre** autorisations. Sans
               « Alertes plein écran », rien ne rallume l'écran quand le téléphone dort.

            Ce build pointe vers le backend de production Vercel.
